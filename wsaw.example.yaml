# wsaw configuration, annotated.
#
# Everything here can also be set with flags or environment variables, so a
# container or systemd deployment needs no file at all for a one-shot run.
# A target list, though, is inherently file-shaped — keep this in version
# control (Tenet 15).
#
# Validate a change before deploying it:
#   wsaw config --config wsaw.yaml --check

# Defaults apply to every target unless the target overrides them.
defaults:
  # Each mode produces its own independent result, and results are never
  # compared across modes: the difference between them *is* the finding.
  #
  #   none    load the page, touch nothing — shows what fires with no decision
  #   reject  refuse consent — anything third-party after this is the headline
  #   accept  grant consent — the upper bound of what the site loads
  consentModes: [none, reject]

  interval: 24h

  # Politeness. wsaw must not be indistinguishable from an attack (NFR §8).
  minInterval: 1h
  jitter: 10m

  # robots.txt: "ignore" for your own properties, "respect" for someone
  # else's. There is no safe universal default, so the choice is explicit.
  robots: ignore

  # Retrying a scan that produced no usable observation — a browser that
  # crashed, a container that would not start, a navigation that failed at the
  # network level. Without it, one dropped connection costs a whole interval:
  # a hole in the target's history until the next scheduled run.
  #
  # A failure is retried; a finding is not. A page that loads nothing, refuses
  # consent, or answers 500 is something wsaw *saw*, and scanning it again
  # would report the same thing at the site's expense.
  #
  # retryAttempts counts the first attempt, so 1 disables retrying.
  retryAttempts: 2
  retryBackoff: 60s
  retryMaxBackoff: 10m
  # Also retry a scan cut short by a timeout or a cap. Off by default:
  # retrying every slow site doubles the load and usually reproduces the same
  # truncation.
  retryTruncated: false

  # Capture budget. Exceeding any of these ends the scan with a recorded
  # reason rather than hanging.
  idleQuiet: 2s
  hardTimeout: 45s
  maxRequests: 3000

  # Evidence is off by default: screenshots and bodies are large, and bodies
  # can contain personal data (Tenet 19).
  screenshots: false
  storeBodies: false

targets:
  - name: marketing-site
    url: https://www.example.com/
    labels:
      team: marketing
      env: prod
    # CDNs you control are first-party for attribution purposes.
    firstPartyDomains:
      - examplecdn.net
    # Third parties you have already reviewed and accepted.
    allowHosts:
      - fonts.gstatic.com
    # Hosts that are a finding whenever they appear at all, new or not.
    denyHosts:
      - doubleclick.net

  - name: checkout
    url: https://shop.example.com/checkout
    consentModes: [reject]
    # A checkout page is worth watching more closely than a landing page.
    interval: 6h
    scrollToBottom: true
    # Credentials never belong in the file; these are indirect references.
    basicAuthUser: "${env:CHECKOUT_USER}"
    basicAuthPassword: "${file:/run/secrets/checkout-password}"

  - name: legacy-microsite
    url: https://legacy.example.org/
    # Kept for its history and baseline rather than deleted.
    disabled: true

browser:
  # Where the browser runs.
  #
  #   auto    a container when podman or docker is usable, otherwise local
  #   podman  require podman (preferred: daemonless and rootless)
  #   docker  require docker
  #   local   a browser on this host
  #
  # A container puts a boundary the operating system enforces between a
  # hostile page and this host, and fixes the browser build so results are
  # comparable across machines. Note that a containerised browser has its own
  # network namespace and cannot reach this machine's localhost.
  runtime: auto

  container:
    # Pinned by digest on purpose: a moving tag would change capture
    # behaviour between scans and a diff would report it as the site's change.
    # wsaw never pulls during a scan — fetch it once with:
    #   podman pull docker.io/chromedp/headless-shell@sha256:...
    image: ""
    memory: 1g
    pidsLimit: 512
    startupTimeout: 90s
    # Chrome keeps renderer shared memory in /dev/shm, and podman and docker
    # both default it to 64 MB. That is not enough for a page that releases
    # its images in one burst: allocations start failing, Chrome reports
    # net::ERR_INSUFFICIENT_RESOURCES for requests that never opened a
    # connection, and the assets those requests would have loaded look like
    # assets the site stopped loading. Both of these are limits, not
    # allocations, so raising them costs nothing until it is needed.
    shmSize: 1g
    fileDescriptors: 8192

  # Leave empty to auto-discover Chrome or Chromium for the local runtime.
  path: ""
  poolSize: 2
  # 1 is the default and the only value that guarantees per-scan isolation by
  # construction: one browser, one profile, one cookie jar. Raise it for
  # throughput, but a browser that serves many scans has more time to
  # accumulate the resource pressure that ends in dropped requests, so keep
  # it low enough that a leak is recycled rather than diffed.
  maxScansPerBrowser: 10
  # The sandbox is the boundary between a hostile page and this host. Only set
  # this where the runtime forbids user namespaces, and expect a warning.
  noSandbox: false

store:
  # sqlite (the default), postgres, mysql, or blob.
  #
  # The evidence always goes in a bucket; the only choice here is where the
  # index goes. SQLite needs no server and is what the single-binary
  # deployment assumes: one binary, one file. The two server databases exist
  # for an organisation that would rather back up and replicate results the
  # way it does everything else. All four are pure Go, so the binary still
  # cross-compiles without CGo.
  #
  # None of them makes wsaw multi-node. Moving the index off the local disk
  # removes the file and its lock, not the constraint: two instances sharing
  # one database, or one bucket, still duplicate every scheduled scan and can
  # still disagree about a baseline.
  driver: sqlite

  # Defaults to the platform state directory when empty. sqlite only.
  path: ""

  # For postgres or mysql instead of path. A DSN carries a password, so it
  # belongs in a secret reference rather than in this file. Anything
  # driver-specific — TLS mode, connect timeout — goes in the DSN itself:
  #
  #   driver: postgres
  #   dsn: "${env:WSAW_STORE_DSN}"   # postgres://wsaw@db:5432/wsaw?sslmode=verify-full
  #
  #   driver: mysql
  #   dsn: "${env:WSAW_STORE_DSN}"   # wsaw@tcp(db:3306)/wsaw?tls=true
  #
  # dsn: ""
  # maxOpenConns: 8
  # maxIdleConns: 2
  # connMaxLifetime: 30m

  # No database at all: the index becomes objects in the same bucket as the
  # evidence, under a "_wsaw/" prefix. One binary, one bucket, nothing to run,
  # patch or fail over — which is what a deployment in Kubernetes against
  # object storage usually wants instead of a database kept alive to hold a
  # few thousand small records.
  #
  #   driver: blob
  #   artifactURL: "${env:WSAW_ARTIFACT_URL}"
  #
  # It takes no path, no dsn and no pool settings, and refuses them by name
  # rather than ignoring them. The bucket is not merely where the evidence
  # goes, it *is* the store, so artifactURL (or artifactDir) is required and
  # there is no default.
  #
  # What it costs, before you choose it: no SQL and no ad-hoc queries, since
  # the key layout answers the handful of questions wsaw asks and nothing
  # else; a request and its latency on every read path, so a page that renders
  # instantly against SQLite takes a couple of hundred milliseconds; and a
  # listing that lags, so a just-written result may not appear in one
  # immediately — not even to the process that wrote it. It stays single-node
  # for the reason above, and the window in which two instances would disagree
  # about a baseline is wider here, because a listing converges on the
  # provider's schedule rather than a transaction's. A long history is
  # compacted into checkpoint objects automatically, with nothing to
  # configure. Read "the store with no database" in the README first.
  #
  # There is no migration between this store and the SQL ones in either
  # direction. All four keep their documents in the same bucket layout, so
  # what does not port is the index, and rebuilding it from the documents is
  # the way across: point the new store at the same bucket and run
  # "wsaw store rebuild-index". Baselines and the audit log do not come across
  # that way — they are decisions, not properties of a scan — so the command
  # reports them as lost rather than pretending otherwise.

  # A store reached over a network — a server database, or a bucket — retries
  # a transient failure rather than failing the scan's result: a restart, a
  # failover, a deadlock, a throttled request. A permanent failure — a
  # constraint violation — is never retried: that would only make it slower.
  # Every retry is logged and counted.
  maxAttempts: 3       # 1 disables retrying
  retryBackoff: 200ms  # doubles for each attempt after the first

  # Where the evidence goes: screenshots, stored response bodies, and every
  # scan's JSON document. The index keeps a reference; the bytes live here,
  # named by their own SHA-256, so identical bytes are one object however many
  # scans captured them.
  #
  # Empty means a directory beside the database file — or beside the state
  # directory when the store is a server database — which is the whole of what
  # the single-binary deployment has to decide about storage. wsaw creates it
  # 0700 and each artifact 0600: evidence can carry personal data.
  #
  # The blob driver is the exception: there is no database file to sit beside
  # and the bucket is the store, so empty is a configuration error rather than
  # a default.
  artifactDir: ""

  # Object storage instead, named as a URL. Set this *or* artifactDir, never
  # both: a store keeps its evidence in one place, and wsaw refuses a
  # configuration that names two rather than silently picking one.
  #
  # s3://, gs:// and azblob:// need the build made with -tags cloudblob; the
  # default binary reaches the local disk and nothing else. Pointed at a scheme
  # it cannot open, either build says so at startup and names the build it is.
  #
  # Credentials are not configured here. Each provider's own chain resolves
  # them, so the identity the machine already has is the one wsaw uses:
  #
  #   # S3. The host is the bucket; the region is required.
  #   #   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (+ AWS_SESSION_TOKEN),
  #   #   or ~/.aws/config with AWS_PROFILE, or an instance profile / IRSA.
  #   #   Bucket needs: s3:PutObject, s3:GetObject, s3:DeleteObject on the
  #   #   objects, s3:ListBucket on the bucket.
  #   artifactURL: "s3://wsaw-evidence?region=eu-central-1"
  #
  #   # Google Cloud Storage.
  #   #   GOOGLE_APPLICATION_CREDENTIALS, `gcloud auth application-default
  #   #   login`, or the attached service account (Workload Identity on GKE).
  #   #   Service account needs: roles/storage.objectAdmin on the bucket.
  #   artifactURL: "gs://wsaw-evidence"
  #
  #   # Azure Blob Storage. The host is the container, not the account.
  #   #   AZURE_STORAGE_ACCOUNT, plus one of AZURE_STORAGE_KEY,
  #   #   AZURE_STORAGE_SAS_TOKEN, AZURE_STORAGE_CONNECTION_STRING — or none of
  #   #   them, which uses the default Azure credential chain (managed
  #   #   identity, az login).
  #   #   Identity needs: Storage Blob Data Contributor on the container.
  #   artifactURL: "azblob://wsaw-evidence"
  #
  #   # An S3-compatible endpoint such as MinIO. Path-style addressing, since
  #   # these services rarely do virtual-host buckets; region is required even
  #   # where the service ignores it.
  #   #   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY hold the access key and
  #   #   secret key. Add &disable_https=true for a service on plain HTTP, and
  #   #   know that the evidence then crosses the network unencrypted.
  #   #   Bucket needs: the same four permissions as S3.
  #   artifactURL: "s3://wsaw-evidence?endpoint=https://minio.example.internal:9000&use_path_style=true&region=us-east-1"
  #
  # Where a URL of yours has to carry a credential, write it as a secret
  # reference — artifactURL: "${env:WSAW_ARTIFACT_URL}" — and wsaw keeps it out
  # of its logs the way it keeps a DSN out of them.
  #
  # Three things object storage costs that a local disk does not: a write can
  # fail for reasons a disk would not (retried per maxAttempts, and recorded
  # rather than hidden when it cannot be); every artifact is a request, so it
  # costs money and latency; and a lifecycle rule on the bucket will delete
  # evidence behind wsaw's back — leave expiry to maxAge and maxPerSeries below.
  # With the blob driver that last one is sharper, because the index is in the
  # bucket too: index objects are small and, once a history settles, old, which
  # is exactly what an expire-by-age rule catches. Exclude the "_wsaw/" prefix
  # from every lifecycle policy, and back it up — baselines and the audit log
  # are decisions, and nothing can rebuild them from a scan.
  #
  # The bucket must be wsaw's alone: a retention sweep walks it, and two
  # deployments sharing one bucket write the same key shapes, so each one's
  # sweep would collect the other's evidence. A path in the URL is not a
  # prefix — "s3://bucket/wsaw" is refused, because every provider takes the
  # bucket from the host and drops the path.
  #
  # artifactURL: ""

  # Whether a reader is redirected to the bucket instead of being served by
  # wsaw. Off, and worth leaving off unless you mean it: a signed URL moves
  # access control from wsaw — which checks the API token, or that a share link
  # actually covers the file asked for — to a string anyone holding it can
  # replay until it expires, and it cannot be withdrawn before then.
  #
  # The lifetime defaults to 5m and may not exceed 1h. A redirect issued to
  # somebody holding a share link is additionally cut to what is left of that
  # link. Only a provider that signs is used this way: switching it on for a
  # local artifact directory is a configuration error, and a bucket that
  # refuses to sign at runtime is logged once and then served by wsaw itself.
  #
  # artifactSignedURLs: false
  # artifactSignedURLTTL: 5m

  maxAge: 2160h  # 90 days; Go duration units, so hours
  maxPerSeries: 200
  writeReport: false
  writeHar: false

scheduler:
  # Defaults to a fraction of NumCPU; Chrome is memory-hungry.
  concurrency: 0
  # Separate from concurrency, so a list full of one site's URLs cannot hit
  # that site with the whole worker pool.
  perOriginConcurrency: 1
  shutdownGrace: 30s
  # A restart should not be a scan storm.
  catchUp: false

normalize:
  # The shipped noise list is included unless this is set to false; without
  # it, the first scan of a real site is a wall of cache-buster churn.
  useDefaultDropParams: true
  dropQueryParams:
    - session_id
  dropTrailingSlash: true
  # Collapse build hashes, so a deploy is not reported as a new asset.
  #
  # Only collapse a path segment that carries no identity of its own. This
  # pattern is safe because the name survives the collapse: app.a1b2c3d4.js
  # and vendor.e5f6a7b8.js stay distinct. A bundler that names chunks by hash
  # alone — Nuxt's _nuxt/CVNmyPYs.js — must NOT be collapsed this way: every
  # chunk would fold into one key and a genuinely new module would disappear.
  pathReplacements:
    - pattern: '\.[0-9a-f]{8,}\.(js|css)$'
      with: '.{hash}.$1'
    # consentmanager encodes its settings descriptor into the filename, and
    # the same version number is already in the sv= parameter of the sibling
    # /delivery/info call. Left alone, one settings publish reports as two
    # added assets and two removed ones.
    - pattern: '/delivery/customdata/[A-Za-z0-9+/=_-]{16,}\.js$'
      with: '/delivery/customdata/{cmpsettings}.js'

  # Compare a script by the version it publishes about itself, rather than by
  # the digest of its bytes.
  #
  # A tag-manager container folds Google-side experiment flags into every
  # response: two consecutive fetches of the same published container can
  # differ by a handful of tokens out of a hundred thousand. Hashing that body
  # reports script-changed on nearly every scan and buries the one publish
  # that mattered. The container states its own version, so compare that.
  #
  # extract needs exactly one capturing group, and the group is the identity.
  # A rule that matches the URL but finds nothing in the body makes the script
  # not comparable rather than changed — the same treatment as a missing
  # digest, because a false "unchanged" is the worse answer here.
  bodyIdentity:
    - urlPattern: 'googletagmanager\.com/gtm\.js'
      extract: '"version":"(\d+)"'
      label: 'GTM container version'

detection:
  # "previous" compares each scan with the one before it; "approved" compares
  # against a baseline someone signed off on.
  baseline: previous
  # Collapse a change and its reverse inside this window, so a rotating CDN
  # host does not alert every scan.
  flapWindow: 6h
  # The share of a scan's requests that may fail for capture reasons — a
  # starved browser, DNS that did not answer — before the asset list stops
  # being trusted for removals.
  #
  # Above this line the scan is reported as degraded and no asset-removed or
  # host-removed change is raised, because one failed loader silences every
  # asset it would have requested and the loss is not confined to the host
  # that failed. Additions are still reported: a false positive there costs a
  # look, a false negative hides a tracker that fired without consent.
  #
  # 0 uses the built-in default of 0.05; a value above 1 disables the check.
  degradedFailureRatio: 0.05
  # Severities only need listing where you disagree with the defaults.
  severity:
    firstPartyAssetAdded: info

consent:
  # Extra rule packs, applied after the shipped ones. A higher priority in
  # your pack overrides a shipped rule without waiting for a release.
  ruleFiles: []
  # Label guessing as a last resort. Results reached this way are flagged.
  allowHeuristic: true
  # "flag" keeps the result and records the failure; "fail" makes a failed
  # banner interaction a scan error.
  onFailure: flag

api:
  enabled: true
  # Loopback by default. A non-loopback address requires a token, and
  # validation refuses to start without one.
  listen: 127.0.0.1:8712
  token: "${env:WSAW_API_TOKEN}"
  webui: true
  # How often the interface reloads itself, for a viewer who has not chosen
  # otherwise on the page. 0 disables it; the floor is 5s, because every
  # refresh re-renders the dashboard and reads every target's latest result.
  #
  # This is only the default. The interval is a property of the person looking
  # rather than of the deployment, so it is set on the dashboard and
  # remembered per browser, and can be given in the URL (?refresh=30) for a
  # wall display that should need no setup.
  refreshInterval: 30s
  # Read-only suits a deployment shared with reviewers.
  readOnly: false
  allowAdHocScan: true

  # Sharing one result by an expiring link, so a colleague or an auditor can
  # read the evidence without being given this token (Story 5.19).
  #
  # Off until configured, because a link publishes data that can be personal
  # to whoever holds it — and because of the one thing to understand before
  # enabling it: a link cannot be revoked before it expires. Nothing is
  # stored, so there is nothing to delete; rotating the key below invalidates
  # every outstanding link at once.
  #
  # The key is a credential and must not be the API token: sharing should not
  # be derivable from admin access, and withdrawing a link should not mean
  # rotating the credential you use.
  # The settings below are commented out rather than merely left at their
  # defaults: a share setting written while enabled is false is a
  # configuration error naming the line, on the same principle as a dsn left
  # behind after a switch of store driver. Uncomment them with enabled: true.
  share:
    # Settings alongside enabled: false are refused, because a file that
    # carries them reads as though sharing were on. Uncomment them together.
    enabled: false
    # key: "${env:WSAW_SHARE_KEY}"   # at least 32 characters
    # validity: 168h                 # a week; what a link lasts by default
    # maxValidity: 720h              # 30 days; the most anyone may ask for
    # Where this wsaw is reachable from, so a minted link is sendable.
    # baseUrl: https://wsaw.example.com

metrics:
  enabled: true
  path: /metrics

notify:
  - name: slack
    url: "${env:WSAW_SLACK_WEBHOOK}"
    minSeverity: high
    # The json function is what keeps a crafted URL in a page from breaking
    # out of the payload.
    template: |
      {"text": {{ printf "%s on %s (%s): %s" .Change.Severity .Target .ConsentMode .Change.Detail | json }}}

  # Microsoft Teams. Unlike a webhook this posts one Adaptive Card per scan
  # rather than one message per change, because forty changes would otherwise
  # be forty messages and get rate-limited.
  #
  # The url is a Power Automate Workflow webhook. Microsoft retired the
  # Office 365 connector webhooks on 30 April 2026; a Workflow URL carries its
  # authorisation in the query string, which is why it belongs in a secret
  # reference and not in this file.
  #
  # There is no template: the card is built by wsaw. A malformed Adaptive Card
  # is *accepted* by the Workflow and posts nothing at all, so leaving the
  # card's shape to configuration would mean an alert path that reports itself
  # healthy while delivering silence.
  - name: teams
    kind: teams
    url: "${env:WSAW_TEAMS_WORKFLOW_URL}"
    minSeverity: medium
    # Where wsaw's web interface is reachable from, so the card can link back
    # to the full result. Without it the card says there is no link rather
    # than inventing one.
    baseUrl: https://wsaw.example.com
    # How many changes one card lists before it reports the rest as a count.
    maxChanges: 12
    # format: messagecard  # deprecated; only for a tenant still on a
    #                      # connector webhook

logging:
  level: info
  # auto renders readable, coloured lines when wsaw is attached to a terminal
  # and JSON when its output is piped, redirected, or collected by a service
  # manager — so a hand-run scan is legible without an aggregator ever
  # receiving decorated text. Force it with pretty, json or text.
  format: auto
