# CI for wsaw.
#
# Lint, vet, and tests are merge blockers (NFR §5). The browser-dependent
# tests run here too, against local fixture servers only — CI must never
# depend on someone else's website staying unchanged (Tenet 13).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The soak test is scheduled rather than per-PR: it takes minutes and
    # guards against slow resource growth, which no pull request should wait
    # on (Story 6.8).
    - cron: "17 3 * * *"

permissions:
  contents: read

env:
  GO_VERSION: "1.25"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install Chromium
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends chromium-browser || \
            sudo snap install chromium

      - name: Report the browser in use
        run: go run ./cmd/wsaw version

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Test
        run: go test -race -timeout 15m ./...

      - name: Coverage of core logic
        if: runner.os == 'Linux'
        run: |
          go test -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  build:
    name: cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # Every supported platform must keep compiling, including the ones no
      # test runs on.
      - name: Build all platforms
        run: make release
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  licenses:
    name: dependency licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # wsaw is MIT; a copyleft dependency would be a licensing problem, so
      # this is a gate rather than a report.
      - name: Check licenses
        run: |
          go run github.com/google/go-licenses@latest check ./... \
            --allowed_licenses=MIT,Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,MPL-2.0

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Generate SBOM
        run: make sbom
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: dist/wsaw.cdx.json

  soak:
    name: soak
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends chromium-browser || \
            sudo snap install chromium
      - name: Soak
        env:
          WSAW_SOAK_DURATION: 20m
        run: go test -tags soak -timeout 40m -run TestSoak ./internal/soak/
