# CI for wsaw.
#
# Lint, vet, and tests are merge blockers (NFR §5). The browser-dependent
# tests run here too, against local fixture servers only — CI must never
# depend on someone else's website staying unchanged (Tenet 13).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The soak test is scheduled rather than per-PR: it takes minutes and
    # guards against slow resource growth, which no pull request should wait
    # on (Story 6.8).
    - cron: "17 3 * * *"

permissions:
  contents: read

env:
  # An exact patch, not a minor. At least the module's go directive, which
  # chromedp and cdproto set to 1.26 — but the release job publishes measured
  # binary sizes (Story 8.8, AC2), and Go binary size moves by tens of
  # kilobytes between patch releases. A floating "1.26" makes two runs weeks
  # apart report different numbers under the same label, and makes dist/SIZES
  # impossible to compare with the table in docs/dependency-review-gocloud.md,
  # which is measured with this same toolchain. Bump it deliberately.
  GO_VERSION: "1.27.1"
  # Pinned, and built from source below with the Go above — see the lint job.
  GOLANGCI_LINT_VERSION: "v2.13.2"
  # Pinned: a floating licence classifier can change a gate's verdict without
  # anything in this repository changing.
  GO_LICENSES_VERSION: "v2.0.1"
  # Pinned for the same reason, and it matters more here: AC5 makes the
  # vulnerability verdict and the SBOM part of what a release publishes, so
  # both have to still mean the same thing tomorrow. Keep in step with the
  # versions in the Makefile.
  GOVULNCHECK_VERSION: "v1.7.0"
  CYCLONEDX_GOMOD_VERSION: "v1.12.0"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install Chromium
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends chromium-browser || \
            sudo snap install chromium

      - name: Report the browser in use
        run: go run ./cmd/wsaw version

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Test
        run: go test -race -timeout 15m ./...

      # The cloud drivers are behind a build tag (Story 8.8, AC3), and a file
      # whose build constraint is off is invisible to go build, go vet and the
      # linter alike. Without this step the second released variant would be
      # compiled for the first time by the release job, or by an operator.
      #
      # Linux only. The tag selects one file, which is pure Go with no platform
      # constraint beyond the tag, so a macOS run repeats the Linux one — and
      # this step compiles some 455 extra packages plus a -race store suite on
      # a runner billed at ten times the rate. The darwin cloud binaries are
      # cross-compiled by the cross-compile job.
      - name: Test the cloudblob build
        if: runner.os == 'Linux'
        run: make test-cloudblob

      - name: Coverage of core logic
        if: runner.os == 'Linux'
        run: |
          go test -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Built from source with the same Go as the project, rather than
      # downloading a prebuilt binary.
      #
      # golangci-lint refuses to analyse a module whose go directive is newer
      # than the Go it was itself built with, and this module's floor is set
      # by chromedp, which tracks Go closely. A published binary will
      # therefore lag the floor sooner or later and the job fails for a reason
      # that has nothing to do with the code. Compiling it here makes that
      # mismatch impossible; the Go build cache keeps the cost small.
      #
      # Twice, under each set of build tags. internal/store/bucket_cloud.go is
      # the one file the cloudblob tag adds, and an untagged lint run cannot
      # see it at all — godox (which is what keeps leftover work markers out of
      # the tree), gosec, staticcheck and the rest would never look at a file
      # that ships in a released binary (Story 8.8, AC3).
      - name: Run golangci-lint
        run: |
          go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }} \
            run --timeout 5m
          go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }} \
            run --timeout 5m --build-tags cloudblob

  build:
    name: cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # Every supported platform must keep compiling, including the ones no
      # test runs on — and both variants, because the cloud SDKs are the only
      # dependencies big enough to smuggle in a platform assumption
      # (Story 8.8, AC1).
      #
      # All four default targets, always. The cloud variant is built for one
      # non-host target on a pull request and for all four on main, on a tag
      # and on the nightly schedule. The three SDKs are pure Go, so a
      # cross-compilation break in them is a compile error that linux/arm64 —
      # a different OS and a different architecture from this runner — catches
      # exactly as well as four targets would, while each extra cloud target
      # costs some 455 packages to compile and about 53 MB of artifact.
      #
      # `make release` also runs `make verify-variants`, which is where the
      # promise that the default build carries no cloud SDK is actually
      # checked (Story 8.8, AC4), and writes dist/SIZES.
      - name: Build all platforms, both variants
        env:
          CLOUD_PLATFORMS: ${{ github.event_name == 'pull_request' && 'linux/arm64' || 'linux/amd64 linux/arm64 darwin/amd64 darwin/arm64' }}
        run: make release CLOUD_PLATFORMS="$CLOUD_PLATFORMS"

      # There is no release-notes generator here, so the measured sizes go
      # where the release artifacts are listed — dist/SIZES, itself covered by
      # SHA256SUMS — and into the job summary, so the number is visible on the
      # run that produced it rather than only inside the artifact (AC2).
      - name: Record the binary sizes
        run: |
          {
            echo '### Binary sizes'
            echo
            echo '```'
            cat dist/SIZES
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # A pull request gets the record, not the payload. The binaries are
      # rebuilt by every run and nobody downloads a PR's copy of them; the
      # checksums and the measured sizes are the two things a reviewer might
      # actually want, and they are a few hundred bytes rather than a few
      # hundred megabytes.
      - name: Upload the release record
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: release-record
          path: |
            dist/SHA256SUMS
            dist/SIZES
          retention-days: 7

      - name: Upload the binaries
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: dist/

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # Twice: govulncheck reports what the analysed build can reach, so a
      # vulnerability in an SDK only the cloud build links is invisible to the
      # default run (Story 8.8, AC5).
      - name: govulncheck
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} ./...
          go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} \
            -tags cloudblob ./...

  licenses:
    name: dependency licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # wsaw is MIT; a copyleft dependency would be a licensing problem, so
      # this is a gate rather than a report.
      #
      # MPL-2.0 is in the allowed set deliberately, not by accident: §3.3
      # permits shipping the larger work under other terms provided the
      # MPL-covered files stay MPL and their source stays available, and wsaw
      # links such a dependency unmodified. Today that is exactly one module,
      # github.com/go-sql-driver/mysql. See NFR §9 for the full reasoning and
      # for what would invalidate it.
      #
      # v2 and a pinned version, both deliberately. v1's licence classifier is
      # from 2021 and fails to recognise several perfectly ordinary BSD-3
      # files — modernc.org/mathutil's among them — which makes the gate fail
      # for a reason that has nothing to do with licensing. Lowering
      # --confidence_threshold makes it pass by classifying that file as
      # BSD-2-Clause, which is simply the wrong answer, and a compliance
      # check that reports the wrong licence is worse than one that errors.
      #
      # Pinned because a floating classifier can change a gate's verdict
      # without anything in this repository changing.
      #
      # Once per released variant. A build tag decides which packages exist,
      # so the default run never looks at the three cloud SDKs — which are by
      # some distance the largest dependency trees in the module (Story 8.8,
      # AC5). GOFLAGS is how the tag reaches the analyser; go-licenses has no
      # flag of its own for it.
      - name: Check licenses
        run: |
          go run github.com/google/go-licenses/v2@${{ env.GO_LICENSES_VERSION }} check ./... \
            --allowed_licenses=MIT,Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,MPL-2.0
          GOFLAGS=-tags=cloudblob \
            go run github.com/google/go-licenses/v2@${{ env.GO_LICENSES_VERSION }} check ./... \
              --allowed_licenses=MIT,Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,MPL-2.0

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # One per released variant: the cloud build's SBOM covers three SDKs the
      # default build never links, and publishing only the smaller document
      # would understate what a release ships (Story 6.1, AC3; Story 8.8, AC5).
      #
      # Both describe this runner's module selection, linux/amd64. wsaw has no
      # GOOS-conditional requirement in go.mod, so that selection is the same
      # for all four released platforms — see the note on the `sbom` target.
      - name: Generate SBOM
        run: make sbom CYCLONEDX_GOMOD_VERSION="${{ env.CYCLONEDX_GOMOD_VERSION }}"
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: dist/*.cdx.json

  soak:
    name: soak
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends chromium-browser || \
            sudo snap install chromium
      - name: Soak
        env:
          WSAW_SOAK_DURATION: 20m
        run: go test -tags soak -timeout 40m -run TestSoak ./internal/soak/
