# CI for wsaw.
#
# Lint, vet, and tests are merge blockers (NFR §5). The browser-dependent
# tests run here too, against local fixture servers only — CI must never
# depend on someone else's website staying unchanged (Tenet 13).

name: CI

on:
  push:
    branches: [main]
    # A release tag is "before a release" (Story 7.6, AC2): the end-to-end
    # stack runs one more time, on the exact commit about to be published,
    # rather than trusting whatever the last scheduled run happened to see.
    tags: ["v*"]
  pull_request:
  schedule:
    # The soak test and the end-to-end stack are both scheduled rather than
    # per-PR: each takes minutes, guards against something a unit test
    # cannot see, and is not something any pull request should wait on
    # (Story 6.8; Story 7.6, AC2).
    - cron: "17 3 * * *"
  # For running the end-to-end stack on demand, without waiting for the
  # schedule or cutting a tag.
  workflow_dispatch:

permissions:
  contents: read

env:
  # At least the module's go directive, which chromedp and cdproto set to 1.26.
  GO_VERSION: "1.26"
  # Pinned, and built from source below with the Go above — see the lint job.
  GOLANGCI_LINT_VERSION: "v2.13.2"
  # Pinned: a floating licence classifier can change a gate's verdict without
  # anything in this repository changing.
  GO_LICENSES_VERSION: "v2.0.1"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install Chromium
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends chromium-browser || \
            sudo snap install chromium

      - name: Report the browser in use
        run: go run ./cmd/wsaw version

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Test
        run: go test -race -timeout 15m ./...

      # A gate, not a readout: below COVER_MIN this fails. The minimum is a
      # ratchet held in the Makefile, and it is calibrated against this job —
      # a developer machine with Podman and Chrome covers container paths that
      # skip here, so its number is the higher one and cannot set the floor.
      - name: Coverage gate
        if: runner.os == 'Linux'
        run: make cover-gate

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Built from source with the same Go as the project, rather than
      # downloading a prebuilt binary.
      #
      # golangci-lint refuses to analyse a module whose go directive is newer
      # than the Go it was itself built with, and this module's floor is set
      # by chromedp, which tracks Go closely. A published binary will
      # therefore lag the floor sooner or later and the job fails for a reason
      # that has nothing to do with the code. Compiling it here makes that
      # mismatch impossible; the Go build cache keeps the cost small.
      - name: Run golangci-lint
        run: |
          go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }} \
            run --timeout 5m

  build:
    name: cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # Every supported platform must keep compiling, including the ones no
      # test runs on.
      - name: Build all platforms
        run: make release
      - uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: dist/

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  licenses:
    name: dependency licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # wsaw is MIT; a copyleft dependency would be a licensing problem, so
      # this is a gate rather than a report.
      #
      # MPL-2.0 is in the allowed set deliberately, not by accident: §3.3
      # permits shipping the larger work under other terms provided the
      # MPL-covered files stay MPL and their source stays available, and wsaw
      # links such a dependency unmodified. Today that is exactly one module,
      # github.com/go-sql-driver/mysql. See NFR §9 for the full reasoning and
      # for what would invalidate it.
      #
      # v2 and a pinned version, both deliberately. v1's licence classifier is
      # from 2021 and fails to recognise several perfectly ordinary BSD-3
      # files — modernc.org/mathutil's among them — which makes the gate fail
      # for a reason that has nothing to do with licensing. Lowering
      # --confidence_threshold makes it pass by classifying that file as
      # BSD-2-Clause, which is simply the wrong answer, and a compliance
      # check that reports the wrong licence is worse than one that errors.
      #
      # Pinned because a floating classifier can change a gate's verdict
      # without anything in this repository changing.
      - name: Check licenses
        run: |
          go run github.com/google/go-licenses/v2@${{ env.GO_LICENSES_VERSION }} check ./... \
            --allowed_licenses=MIT,Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,MPL-2.0

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Generate SBOM
        run: make sbom
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: dist/wsaw.cdx.json

  soak:
    name: soak
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends chromium-browser || \
            sudo snap install chromium
      - name: Soak
        env:
          WSAW_SOAK_DURATION: 20m
        run: go test -tags soak -timeout 40m -run TestSoak ./internal/soak/

  e2e:
    name: end-to-end (${{ matrix.db }})
    # Everything the rest of this workflow proves, it proves in one process.
    # This is the one job that proves wsaw as a *deployed* system — its own
    # container, a server database in another, the Klaro fixture in a third
    # (Epic 7) — and it is not on every push (AC2): it takes minutes to build
    # and run, and a twenty-minute gate on every commit is a gate people
    # learn to route around. It runs on the same schedule as the soak test,
    # on a release tag (the exact commit about to be published, not "whatever
    # the last nightly run happened to see"), and on demand.
    #
    # A failure here is a release blocker (AC3): this repository has no
    # separate automated release pipeline to wire that into directly, so it
    # is enforced the same way the rest of this workflow already is for
    # everything else that blocks a merge — as a required status check —
    # plus this job runs again, deliberately, on the tag itself.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Comfortably above what a cold run of one profile takes locally
    # (bringing the stack up, every consent-mode scan, the diff and baseline
    # assertions, a database restart and a daemon restart); exceeding it
    # fails the run rather than hanging silently (AC6).
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        db: [postgres, mysql]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # The database image is pinned by digest in test/e2e/compose.
      # ${{ matrix.db }}.yaml (AC4), which is what makes this cache key safe
      # to keep forever: it only changes when that pin is deliberately
      # bumped, taken straight from the same file so the two can never drift
      # apart. A cache miss still runs correctly — it just pulls the pinned
      # digest instead of loading it — so a first run, or a bumped pin, costs
      # one slow pull rather than a failure.
      - name: Cache the ${{ matrix.db }} image
        id: cache-db-image
        uses: actions/cache@v4
        with:
          path: /tmp/e2e-db-image.tar
          key: e2e-db-image-${{ hashFiles(format('test/e2e/compose.{0}.yaml', matrix.db)) }}

      - name: Load the cached ${{ matrix.db }} image
        if: steps.cache-db-image.outputs.cache-hit == 'true'
        run: docker load -i /tmp/e2e-db-image.tar

      - name: Pull and cache the ${{ matrix.db }} image
        if: steps.cache-db-image.outputs.cache-hit != 'true'
        run: |
          image=$(sed -n 's/^ *image: *//p' test/e2e/compose.${{ matrix.db }}.yaml | head -1)
          docker pull "$image"
          docker save "$image" -o /tmp/e2e-db-image.tar

      # docker, not the podman these make targets default to: it is what
      # ubuntu-latest ships, and both are exercised locally (Story 7.2).
      - name: Run the end-to-end suite
        run: make e2e-${{ matrix.db }}-test E2E_RUNTIME=docker

      # Every service's log, the stored result documents, and the audit
      # trail, read back the same way the test itself does — plus every
      # diff the run actually produced, which is never stored anywhere to
      # read back (AC5). A red end-to-end run that says only "assertion
      # failed" costs more time than it saves.
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.db }}-artifacts
          path: dist/e2e/artifacts/${{ matrix.db }}/
          if-no-files-found: warn
