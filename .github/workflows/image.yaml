# Container images for wsaw.
#
# Publishes the image the Dockerfile builds — both variants, linux/amd64 and
# linux/arm64 — to the GitHub Container Registry (Story 6.3):
#
#   ghcr.io/pflege-de-labs/wsaw            the default build
#   ghcr.io/pflege-de-labs/wsaw-cloudblob  with the S3, GCS and Azure drivers
#
# and, alongside them, the per-scan browser image deploy/browser builds
# (Story 1.8, AC5) — Chromium with its own sandbox, for a wsaw that runs on the
# host and starts the browser in a container:
#
#   ghcr.io/pflege-de-labs/wsaw-browser
#
# It is versioned with the release it was built from, like the other two, so
# a pinned wsaw and a pinned browser can be read as a pair.
#
# The names follow `make docker`: the variant is in the image name, not only in
# a tag, because an image is pulled by name and two that differ by some 28 MB of
# cloud SDK and by which URL schemes they can reach must not share one
# (Story 8.8, AC3). The image also carries org.opencontainers.image.variant, so
# a pulled image can answer the question itself.
#
# It runs when a release is *published*, not when a tag is pushed. release.yaml
# only ever drafts a release, and a human publishes it; pushing an image to a
# public registry is publishing too, so it waits for the same decision rather
# than going out while the draft is still being read. It can also be run by
# hand for a release that is already published — the way v0.1.0, which
# predates this workflow, got its images.
#
# Its own workflow for the same reason release.yaml is: it is the only thing in
# the repository that needs `packages: write`, and no pull request triggers it.

name: Image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish images for, e.g. v0.1.0"
        required: true

permissions:
  contents: read

# One publish per tag at a time. A second run for the same tag waits rather
# than racing the first to move the version tags.
concurrency:
  group: image-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Lower-case, because registries refuse upper-case repository names and an
  # organisation name is not guaranteed to be one.
  IMAGE_PREFIX: ghcr.io/pflege-de-labs

jobs:
  image:
    name: publish ${{ matrix.variant }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To push to ghcr.io under this repository. Nothing else.
      packages: write
    strategy:
      # One variant failing must not leave the other half-published silently:
      # each is its own job, and the run fails if either does.
      fail-fast: false
      matrix:
        include:
          - variant: default
            name: wsaw
            context: .
            build_tags: ""
            description: wsaw, the website asset watcher (default build)
            chrome_path: /usr/bin/chromium-browser
          - variant: cloudblob
            name: wsaw-cloudblob
            context: .
            build_tags: cloudblob
            description: wsaw, the website asset watcher (cloudblob build)
            chrome_path: /usr/bin/chromium-browser
          - variant: browser
            name: wsaw-browser
            context: deploy/browser
            build_tags: ""
            description: Headless Chromium with its own sandbox, for wsaw's per-scan browser containers
            chrome_path: /usr/bin/chromium-headless-shell
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      # The same two refusals release.yaml makes, for the same reasons, plus
      # one of its own. A tag not on main is a commit ci.yaml never gated. A
      # tag with no published release is one no human has signed off — which a
      # manual run could otherwise publish images for, skipping the draft
      # entirely.
      - name: Refuse a tag that is not a published release on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse "$TAG^{commit}")
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$TAG points at $sha, which is not on main"
            exit 1
          fi
          draft=$(gh release view "$TAG" --json isDraft --jq .isDraft) || {
            echo "::error::$TAG has no GitHub release"
            exit 1
          }
          if [ "$draft" != "false" ]; then
            echo "::error::the release for $TAG is still a draft; publish it first"
            exit 1
          fi
          prerelease=$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)
          echo "SHA=$sha" >> "$GITHUB_ENV"
          echo "PRERELEASE=$prerelease" >> "$GITHUB_ENV"

      # The version, commit and date the binary embeds are the ones `make
      # release` gives the released binaries — the tag, the short commit, and
      # the commit's own timestamp rather than the clock — so `wsaw version`
      # in the image reports exactly what the release's binaries report.
      #
      # Tags: the full version, and major.minor so an operator can follow patch
      # releases. `latest` only for a release that is not a pre-release; a
      # release candidate must not become what an unqualified pull gets.
      - name: Work out the version and the image tags
        run: |
          version="${TAG#v}"
          minor="${version%.*}"
          image="$IMAGE_PREFIX/${{ matrix.name }}"
          tags="$image:$version,$image:$minor"
          if [ "$PRERELEASE" != "true" ]; then
            tags="$tags,$image:latest"
          fi
          {
            echo "VERSION=$version"
            echo "COMMIT=$(git rev-parse --short "$SHA")"
            echo "DATE=$(git show -s --format=%cI "$SHA")"
            echo "IMAGE=$image"
            echo "TAGS=$tags"
          } >> "$GITHUB_ENV"

      # QEMU is only for the arm64 stage that installs Chromium and for the
      # check below that runs the arm64 image. The Go binary is cross-compiled
      # on the runner (see the Dockerfile's build stage).
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # org.opencontainers.image.source is what links the package to this
      # repository on GitHub, so the registry page shows the README and the
      # package inherits the repository's access settings.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.TAGS }}
          build-args: |
            VERSION=${{ env.TAG }}
            COMMIT=${{ env.COMMIT }}
            DATE=${{ env.DATE }}
            BUILD_TAGS=${{ matrix.build_tags }}
          labels: |
            org.opencontainers.image.title=${{ matrix.name }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ env.SHA }}
            org.opencontainers.image.created=${{ env.DATE }}
            org.opencontainers.image.licenses=MIT

      # What was pushed is checked by pulling it back by digest, not by trusting
      # the build: each architecture must run and report the release's version,
      # and the amd64 image must start Chromium's sandbox under the shipped
      # seccomp profile — the property ci.yaml's container-sandbox job checks on
      # a locally built image, here checked on the one people will pull.
      # Each architecture is run by its own manifest digest, read out of the
      # index that was pushed. Running the index digest with --platform is what
      # this step first did, and Docker's containerd image store refuses it
      # ("cannot overwrite digest") once the index has been pulled for one
      # platform. The per-architecture digests are still exactly what was
      # pushed: they are the ones the index names.
      - name: Find each architecture's manifest in the pushed image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          index=$(docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw)
          for arch in amd64 arm64; do
            d=$(printf '%s' "$index" | jq -r --arg a "$arch" \
              '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $a) | .digest')
            if [ -z "$d" ] || [ "$(printf '%s\n' "$d" | wc -l)" -ne 1 ]; then
              echo "::error::the pushed index names no single linux/$arch manifest"
              exit 1
            fi
            echo "DIGEST_${arch^^}=$d" >> "$GITHUB_ENV"
          done

      - name: The pushed image runs and reports the release
        if: matrix.variant != 'browser'
        run: |
          for arch in amd64 arm64; do
            var="DIGEST_${arch^^}"
            out=$(docker run --rm --platform "linux/$arch" "$IMAGE@${!var}" version)
            echo "linux/$arch: $out"
            case "$out" in
              *"wsaw $TAG (commit $COMMIT,"*) ;;
              *) echo "::error::linux/$arch reports '$out', want $TAG at $COMMIT"; exit 1 ;;
            esac
          done

      # The browser image has no wsaw in it; what it has to report is the
      # Chromium it was built with, on each architecture, as the last line of
      # --version — which is what internal/container reads.
      - name: The pushed browser image runs and reports its Chromium
        if: matrix.variant == 'browser'
        run: |
          want=$(sed -n 's/^ARG CHROMIUM_VERSION=//p' deploy/browser/Dockerfile)
          for arch in amd64 arm64; do
            var="DIGEST_${arch^^}"
            out=$(docker run --rm --platform "linux/$arch" "$IMAGE@${!var}" --version | tail -n 1)
            echo "linux/$arch: $out"
            case "$out" in
              "Chromium ${want%-r*}"*) ;;
              *) echo "::error::linux/$arch reports '$out', want Chromium ${want%-r*}"; exit 1 ;;
            esac
          done
      - name: The pushed image keeps Chromium's sandbox
        run: |
          docker run --rm --platform linux/amd64 \
            --security-opt seccomp=deploy/chromium-seccomp.json \
            -e WSAW_CHROME_PATH=${{ matrix.chrome_path }} \
            -v "$PWD/test/sandbox/probe.sh:/probe.sh:ro" \
            --entrypoint sh "$IMAGE@$DIGEST_AMD64" /probe.sh

      - name: Record what was published
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### ${{ matrix.name }} $VERSION"
            echo
            echo "Digest: \`$DIGEST\`"
            echo
            echo "Tags:"
            for t in $(echo "$TAGS" | tr ',' ' '); do
              echo "- \`$t\`"
            done
            echo
            echo "Pin by digest: \`$IMAGE@$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
