# Mounted into the wsaw container at /etc/wsaw/wsaw.yaml by
# `make e2e-pod-up DB=postgres` (Story 7.3). Not for deployment: the token
# and the database password are obvious fixtures, set again next to where
# the Makefile defines them.
#
# This is not compose/wsaw.postgres.yaml with the hostnames swapped: a pod's
# containers share one network namespace and see each other on localhost, so
# every service needs its own port there — collisions are a real failure
# mode inside a pod in a way they are not in Compose, where each container
# has its own address (Story 7.3, AC2).

defaults:
  consentModes: [none, reject, accept]
  robots: ignore
  idleQuiet: 2s
  hardTimeout: 25s

browser:
  runtime: local

targets:
  - name: fixture
    url: http://localhost:18081/

store:
  driver: postgres
  dsn: "${env:WSAW_STORE_DSN}"
  maxAttempts: 3
  retryBackoff: 200ms

api:
  enabled: true
  listen: ":18712"
  token: "${env:WSAW_API_TOKEN}"
  allowAdHocScan: true

logging:
  level: info
