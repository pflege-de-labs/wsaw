# Selects Postgres for the stack in test/e2e/compose.yaml (Story 7.2, AC5).
#
#   docker compose -f test/e2e/compose.yaml -f test/e2e/compose.postgres.yaml up
#
# or `make e2e-compose-up DB=postgres`. The password below is an obvious
# fixture and is not used anywhere else; do not reuse it (AC7).

services:
  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: wsaw
      POSTGRES_PASSWORD: wsaw-e2e-fixture-only
      POSTGRES_DB: wsaw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wsaw -d wsaw"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

  wsaw:
    depends_on:
      db:
        condition: service_healthy
    environment:
      WSAW_STORE_DSN: "postgres://wsaw:wsaw-e2e-fixture-only@db:5432/wsaw?sslmode=disable"
    volumes:
      - ./compose/wsaw.postgres.yaml:/etc/wsaw/wsaw.yaml:ro

# Bringing the stack down with `-v` (which `make e2e-compose-down` always
# does) removes this volume, so a stale database from an earlier run cannot
# make a test pass or fail for reasons that are not in the code (AC8).
volumes:
  postgres-data:
