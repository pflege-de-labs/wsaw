# Selects Postgres for the stack in test/e2e/compose.yaml (Story 7.2, AC5).
#
#   docker compose -f test/e2e/compose.yaml -f test/e2e/compose.postgres.yaml up
#
# or `make e2e-compose-up DB=postgres`. The password below is an obvious
# fixture and is not used anywhere else; do not reuse it (AC7).

services:
  db:
    # Pinned by digest, not just the tag (Story 7.6, AC4): a floating tag can
    # move upstream between CI runs, and the point of an end-to-end suite is
    # to fail because of a change in this repository, not because of one
    # nobody here made. Bump deliberately, with the manifest-list digest, not
    # a single-platform one: `docker buildx imagetools inspect
    # postgres:16-alpine` prints it under "Digest:".
    image: docker.io/library/postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_USER: wsaw
      POSTGRES_PASSWORD: wsaw-e2e-fixture-only
      POSTGRES_DB: wsaw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wsaw -d wsaw"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Published so the e2e test (Story 7.4) can read results back with SQL
    # from the host, directly, rather than through wsaw's own API — the
    # whole point of asserting on what the database actually holds.
    ports:
      - "127.0.0.1:5432:5432"

  wsaw:
    depends_on:
      db:
        condition: service_healthy
    environment:
      WSAW_STORE_DSN: "postgres://wsaw:wsaw-e2e-fixture-only@db:5432/wsaw?sslmode=disable"
    volumes:
      - ./compose/wsaw.postgres.yaml:/etc/wsaw/wsaw.yaml:ro

# Bringing the stack down with `-v` (which `make e2e-compose-down` always
# does) removes this volume, so a stale database from an earlier run cannot
# make a test pass or fail for reasons that are not in the code (AC8).
volumes:
  postgres-data:
