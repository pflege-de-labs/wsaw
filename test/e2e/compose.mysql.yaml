# Selects MySQL for the stack in test/e2e/compose.yaml (Story 7.2, AC5).
#
#   docker compose -f test/e2e/compose.yaml -f test/e2e/compose.mysql.yaml up
#
# or `make e2e-compose-up DB=mysql`. The password below is an obvious
# fixture and is not used anywhere else; do not reuse it (AC7).

services:
  db:
    # Pinned by digest, not just the tag (Story 7.6, AC4): a floating tag can
    # move upstream between CI runs, and the point of an end-to-end suite is
    # to fail because of a change in this repository, not because of one
    # nobody here made. Bump deliberately, with the manifest-list digest, not
    # a single-platform one: `docker buildx imagetools inspect mysql:8.4`
    # prints it under "Digest:".
    image: docker.io/library/mysql:8.4@sha256:3466ba4a4828aa8d46fb7c3bc16b67b781c98413cf4ea0fac6feaa6e881faa26
    environment:
      MYSQL_DATABASE: wsaw
      MYSQL_USER: wsaw
      MYSQL_PASSWORD: wsaw-e2e-fixture-only
      MYSQL_ROOT_PASSWORD: wsaw-e2e-fixture-only-root
    healthcheck:
      # -h127.0.0.1, not -h localhost: the mysql client treats "localhost" as
      # "use the Unix socket", which the init server answers on before the
      # real server is listening on TCP — exactly the connection wsaw itself
      # makes. A probe not forced onto TCP reports ready too early.
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uwsaw -pwsaw-e2e-fixture-only --silent"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - mysql-data:/var/lib/mysql
    # Published so the e2e test (Story 7.5) can read results back with SQL
    # from the host, directly, rather than through wsaw's own API — the
    # whole point of asserting on what the database actually holds.
    ports:
      - "127.0.0.1:3306:3306"

  wsaw:
    depends_on:
      db:
        condition: service_healthy
    environment:
      WSAW_STORE_DSN: "wsaw:wsaw-e2e-fixture-only@tcp(db:3306)/wsaw"
    volumes:
      - ./compose/wsaw.mysql.yaml:/etc/wsaw/wsaw.yaml:ro

# Bringing the stack down with `-v` (which `make e2e-compose-down` always
# does) removes this volume, so a stale database from an earlier run cannot
# make a test pass or fail for reasons that are not in the code (AC8).
volumes:
  mysql-data:
