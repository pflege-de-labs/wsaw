# Story 7.2 — the whole wsaw system as a Docker Compose stack: wsaw, a
# server database, and the Klaro fixture's two origins (Story 7.1). One
# command reproduces a deployment problem instead of an afternoon of it.
#
# The database is not defined here — pick one with an override file, which is
# the whole reason this file and the next two exist rather than one:
#
#   docker compose -f test/e2e/compose.yaml -f test/e2e/compose.postgres.yaml up
#   docker compose -f test/e2e/compose.yaml -f test/e2e/compose.mysql.yaml    up
#
# or `make e2e-compose-up DB=postgres` / `DB=mysql`, which does the same and
# waits for every service to actually be healthy rather than merely started.
#
# Every credential anywhere in this stack is an obvious fixture
# (wsaw-e2e-fixture-only...). Do not reuse them anywhere real (AC7).

services:
  # The third-party origin the fixture loads from, reached by its own
  # hostname so first-party and third-party attribution is exercised rather
  # than assumed (Story 7.1, AC2).
  tracker:
    build:
      context: ../..
      dockerfile: test/e2e/fixture/Containerfile
    command: ["-role=third-party", "-listen=:8080", "-self-base=http://tracker:8080"]
    # A second, extra alias for the same container rather than a fourth
    # service: the "changed" variant (Story 7.1, AC5) only needs one more
    # *hostname* to appear as a third party — the extra host's one asset,
    # /extra.gif, is a plain static file with no self-referencing URL of its
    # own to get wrong by answering under a second name.
    networks:
      default:
        aliases: [extra-tracker]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/__fixture/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30

  # The Klaro fixture website itself (Story 7.1).
  site:
    build:
      context: ../..
      dockerfile: test/e2e/fixture/Containerfile
    command:
      - "-role=site"
      - "-listen=:8080"
      - "-third-party-base=http://tracker:8080"
      - "-extra-third-party-base=http://extra-tracker:8080"
    depends_on:
      tracker:
        condition: service_healthy
    # Published so a test driving the stack from the host (Story 7.4, 7.5)
    # can switch the fixture's variant with a real PUT — the fixture image
    # ships no curl, and busybox wget cannot send one (AC5 of Story 7.1).
    ports:
      - "127.0.0.1:18081:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/__fixture/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30

  wsaw:
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      site:
        condition: service_healthy
      tracker:
        condition: service_healthy
      # The database dependency is added by whichever override file is in
      # play (AC5); this file alone has no database to wait for.
    # The container default, 64 MiB, crashes Chrome on a real page. The fix
    # belongs in the shipped file, not a troubleshooting section (AC6).
    shm_size: "1gb"
    environment:
      WSAW_API_TOKEN: wsaw-e2e-fixture-only-token
    # Published on 18712, not wsaw's documented default 8712: that default is
    # exactly the port a wsaw already running on this machine for real would
    # be using, and a request that lands on the wrong process fails with a
    # confusing 401 rather than a connection error (the pod uses the same
    # port for the same reason — Story 7.3).
    ports:
      - "127.0.0.1:18712:8712"
    healthcheck:
      # The API requires the token once one is set (AC7 puts one here), and
      # that applies to /api/v1/health too — there is no unauthenticated
      # exemption for it, so the probe carries the same header a real client
      # would.
      # $$ so Compose passes a literal $ through for the container's own
      # shell to expand at run time, rather than trying to interpolate it
      # itself from this file's environment.
      test: ["CMD-SHELL", "wget -qO- --header=\"Authorization: Bearer $$WSAW_API_TOKEN\" http://localhost:8712/api/v1/health"]
      interval: 2s
      timeout: 2s
      retries: 30
