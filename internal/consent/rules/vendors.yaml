# Vendor consent rules shipped with wsaw.
#
# These are data, not code: a CMP that changes its markup is fixed by editing
# this file or by supplying an override pack, never by releasing a new binary.
#
# Conventions
#   detect  must evaluate truthy for the rule to be tried
#   verify  must evaluate truthy afterwards, otherwise the outcome is
#           recorded as "unverified" rather than "applied"
#   eval    is reserved for a vendor's own documented API, which is more
#           robust than clicking a button whose label may be translated
#
# Higher priority is tried first. Vendor rules sit above the heuristic
# fallback in heuristics.yaml.

version: 1

rules:
  - name: usercentrics-v2
    vendor: Usercentrics
    priority: 100
    detect: |
      !!(window.UC_UI || document.querySelector('#usercentrics-root, #usercentrics-cmp-ui'))
    accept:
      - waitFor: "#usercentrics-root, #usercentrics-cmp-ui"
        optional: true
      - eval: |
          (async () => {
            if (window.UC_UI && window.UC_UI.acceptAllConsents) {
              await window.UC_UI.acceptAllConsents();
              if (window.UC_UI.closeCMP) await window.UC_UI.closeCMP();
              return true;
            }
            return false;
          })()
    reject:
      - waitFor: "#usercentrics-root, #usercentrics-cmp-ui"
        optional: true
      - eval: |
          (async () => {
            if (window.UC_UI && window.UC_UI.denyAllConsents) {
              await window.UC_UI.denyAllConsents();
              if (window.UC_UI.closeCMP) await window.UC_UI.closeCMP();
              return true;
            }
            return false;
          })()
    verify: |
      !!(window.UC_UI && window.UC_UI.isInitialized && window.UC_UI.isInitialized())

  - name: onetrust
    vendor: OneTrust
    priority: 100
    detect: |
      !!(window.OneTrust || window.Optanon || document.getElementById('onetrust-banner-sdk'))
    accept:
      - eval: |
          (() => {
            if (window.OneTrust && window.OneTrust.AllowAll) { window.OneTrust.AllowAll(); return true; }
            return false;
          })()
      - click: "#onetrust-accept-btn-handler"
        optional: true
    reject:
      - eval: |
          (() => {
            if (window.OneTrust && window.OneTrust.RejectAll) { window.OneTrust.RejectAll(); return true; }
            return false;
          })()
      - click: "#onetrust-reject-all-handler"
        optional: true
      # Some deployments hide "reject all" behind the preference centre.
      - click: "#onetrust-pc-btn-handler"
        optional: true
      - click: ".ot-pc-refuse-all-handler, .save-preference-btn-handler"
        optional: true
    verify: |
      !document.getElementById('onetrust-banner-sdk') ||
      getComputedStyle(document.getElementById('onetrust-banner-sdk')).display === 'none'

  - name: cookiebot
    vendor: Cookiebot
    priority: 100
    detect: |
      !!(window.Cookiebot || window.CookieConsent || document.getElementById('CybotCookiebotDialog'))
    accept:
      - eval: |
          (() => {
            if (window.Cookiebot && window.Cookiebot.submitCustomConsent) {
              window.Cookiebot.submitCustomConsent(true, true, true);
              return true;
            }
            if (window.CookieConsent && window.CookieConsent.setConsent) { return false; }
            return false;
          })()
      - click: "#CybotCookiebotDialogBodyLevelButtonLevelOptinAllowAll, #CybotCookiebotDialogBodyButtonAccept"
        optional: true
    reject:
      - eval: |
          (() => {
            if (window.Cookiebot && window.Cookiebot.submitCustomConsent) {
              window.Cookiebot.submitCustomConsent(false, false, false);
              return true;
            }
            return false;
          })()
      - click: "#CybotCookiebotDialogBodyButtonDecline, #CybotCookiebotDialogBodyLevelButtonLevelOptinDeclineAll"
        optional: true
    verify: |
      !!(window.Cookiebot && window.Cookiebot.hasResponse)

  - name: didomi
    vendor: Didomi
    priority: 100
    detect: |
      !!(window.Didomi || document.getElementById('didomi-host'))
    accept:
      - eval: |
          (() => {
            if (window.Didomi && window.Didomi.setUserAgreeToAll) { window.Didomi.setUserAgreeToAll(); return true; }
            return false;
          })()
    reject:
      - eval: |
          (() => {
            if (window.Didomi && window.Didomi.setUserDisagreeToAll) { window.Didomi.setUserDisagreeToAll(); return true; }
            return false;
          })()
    verify: |
      !!(window.Didomi && window.Didomi.getUserConsentStatusForAll)

  - name: sourcepoint
    vendor: Sourcepoint
    priority: 90
    detect: |
      !!(window._sp_ || document.querySelector('iframe[id^="sp_message_iframe"]'))
    accept:
      - waitFor: 'iframe[id^="sp_message_iframe"]'
        optional: true
      - click: "button[title='Accept all'], button[title='Accept All'], .sp_choice_type_11"
    reject:
      - waitFor: 'iframe[id^="sp_message_iframe"]'
        optional: true
      - click: "button[title='Reject all'], button[title='Reject All'], .sp_choice_type_13"
    verify: |
      !document.querySelector('iframe[id^="sp_message_iframe"]')

  # Consentmanager, driven through its documented __cmp API.
  #
  #   https://www.consentmanager.net/en/help/developer-reference/javascript-api/
  #   https://www.consentmanager.net/en/help/developer-reference/cmp-events/
  #
  #   __cmp('setConsent', 1)   simulate "accept all"
  #   __cmp('setConsent', 0)   simulate "reject all"
  #   __cmp('consentStatus')   -> {consentExists: bool, consentData: string}
  #   __cmp('close')           close the consent layer
  #
  # Two things this API gives us that clicking never could: setConsent means
  # the choice is expressed the way the CMP itself defines it, regardless of
  # markup, language or layout; and consentStatus.consentExists is a direct
  # read-back that the choice was actually recorded, rather than the much
  # weaker inference that a banner disappeared.
  #
  # __cmp exists as a stub before the CMP initialises, and a call made against
  # the stub is queued rather than applied. Acting too early would therefore
  # look like success while changing nothing, so each step waits for the
  # documented readiness signal — the "settings" event, or a consentStatus
  # that answers — before expressing a choice. The wait is bounded; the rule
  # reports false rather than hanging, and the engine records that.
  #
  # Priority matches the other API-driven vendor rules. It stays below a
  # site-specific override, which is the whole point of user rule packs.
  - name: consentmanager
    vendor: Consentmanager
    priority: 100
    detect: |
      !!(window.__cmp || document.getElementById('cmpbox') || document.querySelector('.cmpboxbtn'))
    accept:
      - eval: |
          (async () => {
            if (typeof window.__cmp !== 'function') return false;
            if (!await window.__wsawCmpReady()) return false;
            try {
              window.__cmp('setConsent', 1);
              window.__cmp('close');
            } catch (e) { return false; }
            return await window.__wsawCmpRecorded();
          })()
      # Some deployments render the layer without exposing the API on the top
      # frame. Clicking is the documented button markup, and optional so that
      # a successful API call does not fail here.
      - click: "#cmpwelcomebtnyes, .cmpboxbtnyes, .cmpboxbtncustomchoices ~ .cmpboxbtnyes"
        optional: true
    reject:
      - eval: |
          (async () => {
            if (typeof window.__cmp !== 'function') return false;
            if (!await window.__wsawCmpReady()) return false;
            try {
              window.__cmp('setConsent', 0);
              window.__cmp('close');
            } catch (e) { return false; }
            return await window.__wsawCmpRecorded();
          })()
      - click: "#cmpwelcomebtnno, .cmpboxbtnno, .cmpboxbtnnoall"
        optional: true
    # Verification asks whether *this* interaction was recorded, not merely
    # whether some choice is on record: a page carrying consent from an
    # earlier scan would satisfy the latter without wsaw having done
    # anything. The banner being gone is accepted only as a fallback, for
    # deployments where the API is not reachable from the top frame.
    verify: |
      (() => {
        try {
          if (typeof window.__cmp === 'function' && window.__wsawCmpChanged) {
            return window.__wsawCmpChanged();
          }
        } catch (e) { /* fall through to the markup check */ }
        const box = document.getElementById('cmpbox');
        return !box || getComputedStyle(box).display === 'none';
      })()

  # CCM19 (papoo Software), driven through its window.CCM API.
  #
  #   window.CCM.grantAllPrivileges()   accept all, persist, close the widget
  #   window.CCM.revokeAllPrivileges()  reject all, persist, close the widget
  #   window.CCM.consent                getter, true once a choice is recorded
  #
  # There is no public documentation of this API; the method and property
  # names above were confirmed by reading the vendor's shipped app.js, which
  # calls exactly the same internal methods from its own accept/decline
  # button handlers. The click fallback mirrors the button markup found in
  # the same script: the accept-all button shares its class with the
  # "save selection" button and is distinguished only by
  # data-full-consent="true".
  - name: ccm19
    vendor: CCM19
    priority: 100
    detect: |
      !!(window.CCM || document.querySelector('#ccm-root, #ccm-widget, .ccm-modal'))
    accept:
      # An explicit false from eval is a step failure (rules.go convention),
      # which would otherwise abort the rule before the click fallback ever
      # ran. Marking it optional lets a page whose script failed to expose
      # window.CCM still be handled through the button markup below.
      - eval: |
          (() => {
            if (window.CCM && window.CCM.grantAllPrivileges) { window.CCM.grantAllPrivileges(); return true; }
            return false;
          })()
        optional: true
      - click: '.ccm--save-settings[data-full-consent="true"]'
        optional: true
    reject:
      - eval: |
          (() => {
            if (window.CCM && window.CCM.revokeAllPrivileges) { window.CCM.revokeAllPrivileges(); return true; }
            return false;
          })()
        optional: true
      - click: ".ccm--decline-cookies"
        optional: true
    # Some deployments render the widget markup without exposing window.CCM
    # on the top frame. The consent getter is checked first because it is a
    # direct read-back of the recorded choice; the modal being gone is only
    # a fallback for when the API is unreachable and a click was the only
    # option.
    verify: |
      (() => {
        if (window.CCM && typeof window.CCM.consent !== 'undefined') { return !!window.CCM.consent; }
        return !document.querySelector('#ccm-root, .ccm-modal');
      })()

  - name: complianz
    vendor: Complianz
    priority: 80
    detect: |
      !!document.querySelector('#cmplz-cookiebanner-container, .cmplz-cookiebanner')
    accept:
      - click: ".cmplz-accept"
    reject:
      - click: ".cmplz-deny"
    verify: |
      !document.querySelector('.cmplz-cookiebanner.cmplz-show')

  - name: borlabs
    vendor: Borlabs Cookie
    priority: 80
    detect: |
      !!(window.BorlabsCookie || document.getElementById('BorlabsCookieBox'))
    accept:
      - click: "#BorlabsCookieBox a._brlbs-btn-accept-all, #BorlabsCookieBox a._brlbs-btn-accept-all-cookies"
    reject:
      - click: "#BorlabsCookieBox a._brlbs-btn-refuse-all, #BorlabsCookieBox a._brlbs-refuse-cookie"
    verify: |
      !!(window.BorlabsCookie && window.BorlabsCookie.Cookie)

  - name: klaro
    vendor: Klaro
    priority: 70
    detect: |
      !!(window.klaro || document.getElementById('klaro'))
    accept:
      - click: ".cm-btn-success, .cn-buttons .cm-btn-accept-all"
    reject:
      - click: ".cm-btn-decline, .cn-decline"
    verify: |
      !document.querySelector('#klaro .cookie-notice')

  - name: osano
    vendor: Osano
    priority: 70
    detect: |
      !!(window.Osano || document.querySelector('.osano-cm-dialog'))
    accept:
      - click: ".osano-cm-accept-all"
    reject:
      - click: ".osano-cm-denyAll, .osano-cm-deny"
    verify: |
      !document.querySelector('.osano-cm-dialog--type_bar.osano-cm-dialog--visible')
