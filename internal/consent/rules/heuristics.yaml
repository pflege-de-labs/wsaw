# Last-resort heuristic rules.
#
# These guess at a banner by matching visible button labels. They are marked
# heuristic:true, which means every result produced through them is flagged as
# such — a reviewer must be able to tell a documented CMP API from a guess
# (Tenet 11).
#
# German and English are covered because those are wsaw's first audiences.
# Additional languages belong here, not in Go code.
#
# Priority is deliberately low: any vendor rule is preferred.

version: 1

rules:
  - name: generic-label-match
    priority: 1
    heuristic: true
    detect: |
      (() => {
        const words = /(cookie|consent|datenschutz|privacy|einwilligung|zustimmung)/i;
        const nodes = document.querySelectorAll('div,section,aside,dialog,form');
        for (const n of nodes) {
          if (!n.offsetParent && n.tagName !== 'DIALOG') continue;
          const r = n.getBoundingClientRect();
          if (r.height < 40 || r.width < 200) continue;
          if (words.test(n.textContent || '')) return true;
        }
        return false;
      })()
    accept:
      - eval: |
          window.__wsawClickLabel([
            'alle akzeptieren', 'alles akzeptieren', 'akzeptieren', 'zustimmen',
            'einverstanden', 'alle cookies zulassen', 'zustimmen und weiter',
            'accept all', 'accept all cookies', 'allow all', 'i accept',
            'accept', 'agree', 'got it', 'ok'
          ])
    reject:
      - eval: |
          window.__wsawClickLabel([
            'alle ablehnen', 'alles ablehnen', 'ablehnen', 'nur notwendige',
            'nur essenzielle', 'nur erforderliche', 'weiter ohne zustimmung',
            'ohne einwilligung fortfahren', 'nicht zustimmen',
            'reject all', 'decline all', 'reject', 'decline',
            'only necessary', 'necessary only', 'essential only',
            'continue without accepting', 'refuse all'
          ])
    verify: |
      (() => {
        const words = /(cookie|consent|datenschutz|einwilligung)/i;
        const nodes = document.querySelectorAll('div,section,aside,dialog,form');
        for (const n of nodes) {
          if (!n.offsetParent && n.tagName !== 'DIALOG') continue;
          const r = n.getBoundingClientRect();
          if (r.height < 40 || r.width < 200) continue;
          if (words.test(n.textContent || '')) return false;
        }
        return true;
      })()
